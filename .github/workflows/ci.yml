name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (format + lint)
        run: pnpm format:check

      - name: ESLint (accessibility + Next.js rules)
        run: pnpm lint

      - name: Stylelint (CSS)
        run: pnpm lint:css

      - name: Markdownlint
        run: pnpm lint:md

      - name: i18n check
        run: pnpm i18n:check

      - name: Test traceability
        run: pnpm traceability:check

      - name: Token contrast (WCAG 2.2)
        run: pnpm contrast:check

      - name: TypeScript typecheck
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            apps/*/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**', 'packages/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate dependency rules
        run: pnpm depcruise

  python:
    name: Python Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Turns "no database, skip the durability test" into a hard failure. Without it, a
      # database that failed to start would look identical to a green run.
      ARTLOUPE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      # Pinned to the version `pnpm-lock.yaml` resolves for the `supabase` devDependency, so
      # CI applies migrations with the same CLI as a local `pnpm supabase start`. Bump both
      # together.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # The same stack `pnpm supabase start` runs locally, minus every service the tests do
      # not touch. A plain `postgres:` service container is lighter and was what this job used
      # first, but it has no `anon` or `authenticated` roles and applies no migrations -- so
      # `supabase/migrations/` was never executed in CI, and a privilege assertion written
      # against it would pass against roles that do not exist. `test_schema_privileges.py`
      # needs both to mean anything.
      - name: Start Supabase (database only)
        working-directory: .
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest
