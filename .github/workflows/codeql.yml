name: CodeQL

# No paths-ignore, deliberately. CodeQL's `Analyze` jobs are REQUIRED status checks, and a
# path filter would skip them on a docs-only PR — leaving a required check that never reports
# and a pull request that can never merge, with nothing on screen to explain why. Running the
# analysis on every PR costs a couple of minutes of Actions, which are free on a public repo.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
