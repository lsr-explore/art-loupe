name: Feature
description: A new capability or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        **Title:** prefix with the app/package scope (e.g. `studio:`, `operations:`,
        `agent:`) — the type is set by the **enhancement** label, not the title.
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: High-level summary of the feature and its purpose. Include who will benefit and why.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: demo
    attributes:
      label: Demo steps
      description: Copy-pasteable click-through to show it working (launch, inputs, what to expect).
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data to reproduce
      description: Inputs / fixtures / seed state needed to walk the flow. **No secrets or credentials.**
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Where applicable — mockups or expected end state. Drag images in.
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: Safety notes
      description: Optional — grounding and authorship implications. A claim that could go out uncited or unsupported, a fabricated attribution, or any path that would have the system generate imagery rather than reason about work the artist supplied.
    validations:
      required: false
  - type: textarea
    id: tech-notes
    attributes:
      label: Tech notes
      description: Optional — approach, relevant files, links.
    validations:
      required: false
  - type: textarea
    id: a11y-notes
    attributes:
      label: A11y notes
      description: Optional — WCAG criteria, keyboard/AT expectations, affected users.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Optional — any open questions or uncertainties related to this feature.
    validations:
      required: false
