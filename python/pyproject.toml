# Art Loupe — Python workspace root (uv).
# Virtual root: manages members only, ships no package of its own.
# TS lives in apps/ + packages/; all Python lives here, organized by role.

[tool.uv.workspace]
members = ["services/*", "libs/*"]

[dependency-groups]
dev = [
  "ruff>=0.15",
  "pytest>=8.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=5.0",
  "poethepoet>=0.47.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
# --strict-markers validates the marker NAME; conftest.py validates `trace`'s ARGUMENTS
# against docs/test-traceability-reports/flows.json, because pytest cannot know our flow catalog.
addopts = "-ra --strict-markers"
# `auto` so an async test needs no `@pytest.mark.asyncio`. Not merely ergonomic: the
# traceability parser only recognises `pytestmark` when `pytest.mark.trace` appears on the
# assignment's first line, so a list of markers there would silently read as untagged.
asyncio_mode = "auto"
testpaths = ["libs", "services"]
markers = [
  "trace(flow, category): the application flow this test verifies, and what aspect of it — see docs/test-traceability-reports/README.md",
]

# Task runner for the Python workspace — the package.json-scripts analog.
# From python/:       uv run poe <task>                  (e.g. uv run poe check)
# From the repo root: uv run --directory python poe <task>
[tool.poe.tasks]
# The exit-5 ("no tests collected") tolerance that lived here is gone, on the instruction
# left with it: real tests landed with `libs/auth`, so collecting nothing now means the
# suite silently stopped running, and swallowing that would hide it.
test = { cmd = "pytest", help = "Run the test suite" }
test-cov = { cmd = "pytest --cov=artloupe --cov-report=term-missing", help = "Run tests with coverage" }
# The other half of traceability: `test-cov` says how MUCH of a module runs; this says WHICH
# tests run each line, so "if I change rules.py:110, what should catch it?" has an answer.
# Chains with the `trace` flow marks — line -> covering tests -> the flows those tests verify.
#
# Contexts are turned on by `--cov-context=test` HERE rather than by `dynamic_context` in a
# [tool.coverage.run] section, and that is deliberate. A config setting applies to every
# coverage run, so plain `test-cov` would pay the tracking cost and write context rows nobody
# asked for. Scoping it to this task also gets richer ids: pytest-cov records full nodeids, so
# parametrized cases stay distinct, where coverage.py's own `test_function` heuristic collapses
# them to one name per function.
#
# Pass `--cov=artloupe` (package), never a dotted module path: `--cov=artloupe.agent.rules` dies
# in collection with `KeyError: 'pydantic.root_model'`.
test-cov-contexts = { sequence = [
  "_cov-run",
  "_cov-html",
], help = "Coverage HTML annotated with the tests covering each line (opens htmlcov/index.html)" }
_cov-run = { cmd = "pytest --cov=artloupe --cov-context=test --cov-report=", help = "internal: record coverage with per-test contexts" }
_cov-html = { cmd = "coverage html --show-contexts", help = "internal: render the context-annotated HTML report" }
lint = { cmd = "ruff check", help = "Lint" }
lint-fix = { cmd = "ruff check --fix", help = "Lint and autofix" }
format = { cmd = "ruff format", help = "Format" }
format-check = { cmd = "ruff format --check", help = "Check formatting (no writes)" }
check = { sequence = ["format-check", "lint", "test"], help = "All quality checks" }


[tool.poe.tasks.clean]
help = "Remove Python caches (pytest, ruff, dev AI cache, coverage, eval reports, __pycache__)"
# Sweeps the DEFAULT locations only. Overridden ARTLOUPE_AI_CACHE_DIR / ARTLOUPE_EVAL_REPORTS_DIR
# paths are self-managed — feeding an arbitrary env-var path into `rm -rf` would be a footgun.
shell = "rm -rf .pytest_cache .ruff_cache .cache .coverage htmlcov eval-reports && find . -type d -name __pycache__ -not -path './.venv/*' -prune -exec rm -rf {} +"
