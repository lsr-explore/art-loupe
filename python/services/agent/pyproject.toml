# Art Loupe agent service — LangGraph behind FastAPI.
#
# The one HTTP surface the Python side exposes. Per ADR 0002 the browser never reaches it
# directly: a Next.js route handler forwards the artist's Supabase access token, and this
# service verifies it through `artloupe-auth` rather than re-deriving token handling.
#
# Deliberately not a Dockerfile yet. Nothing is deployed, so container packaging is deferred
# with the deployment decision rather than guessed at now — see docs/design/slice-1-build-plan.md.
[project]
name = "artloupe-agent"
version = "0.1.0"
description = "LangGraph orchestration service for the Art Loupe studio director (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "artloupe-auth",
  # The ledger and the run guards. A hard dependency, not an optional one: an unmetered,
  # uncapped run is the failure this service must not be able to produce.
  "artloupe-metering",
  "artloupe-schemas",
  # Pinned at the majors the workspace already resolves; FastAPI arrives via artloupe-auth
  # but is declared here too, because this package imports it directly.
  "fastapi>=0.115",
  "langgraph>=0.2",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  # Exercises the ASGI app in-process, no live server and no open port.
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: `artloupe` carries no __init__.py, mirroring the @artloupe/* scope.
packages = ["src/artloupe"]

[tool.uv.sources]
artloupe-auth = { workspace = true }
artloupe-metering = { workspace = true }
artloupe-schemas = { workspace = true }
