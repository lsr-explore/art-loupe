# Art Loupe image tools — the deterministic pixel tools the Studio Director selects (FR-301/302).
#
# Every tool here reads a photograph and returns an artifact plus FR-305 metadata. None of them
# produces or alters a pixel the artist will be shown as imagery (FR-801); what comes back is
# geometry and measurement, never a picture.
#
# This package owns the workspace's one `cv2`. It must be `opencv-contrib-python` — the
# distribution `mediapipe` pulls in for PR 10 — and never `opencv-python` alongside it: both
# install the same `cv2` namespace and uv resolves the pair without error, so the breakage is
# silent until import. `tests/test_dependency_hygiene.py` enforces it.
[project]
name = "artloupe-image-tools"
version = "0.1.0"
description = "Deterministic image-analysis tools for Art Loupe: perspective, and later landmarks and plates."
requires-python = ">=3.12"
dependencies = [
  # `ArtifactMetadata` is the shared FR-305 contract. Tools fill it; they do not redefine it.
  "artloupe-schemas",
  "numpy>=2",
  "opencv-contrib-python>=5.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: `artloupe` carries no __init__.py, mirroring the @artloupe/* scope.
packages = ["src/artloupe"]

[tool.uv.sources]
artloupe-schemas = { workspace = true }
