# Art Loupe persistence — the checkpointer every graph resumes from.
#
# A library, not a service. Its reason for existing is constructing the LangGraph checkpoint
# saver, as a process-wide singleton, so a run interrupted for artist correction can resume in
# a *different process* than the one that started it (FR-402/403/404).
#
# That cross-process requirement is why an in-memory saver is not sufficient outside tests, and
# it is the whole reason this package exists separately from `artloupe-agent`.
#
# It also names the `public` tables holding projects and their originals, and carries the suite
# that holds their row policies to account. Both halves answer one question -- what may reach
# which rows -- and they answer it differently: checkpoints stay off the API surface, while
# project rows must be on it and are confined by policies instead.
[project]
name = "artloupe-persistence"
version = "0.1.0"
description = "LangGraph checkpointing over Postgres, isolated in its own schema."
requires-python = ">=3.12"
dependencies = [
  "langgraph-checkpoint-postgres>=2.0",
  # psycopg 3. `binary` ships a wheel so no local libpq/compiler is needed; `pool` provides
  # the AsyncConnectionPool the saver runs on.
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: `artloupe` carries no __init__.py, mirroring the @artloupe/* scope.
packages = ["src/artloupe"]
