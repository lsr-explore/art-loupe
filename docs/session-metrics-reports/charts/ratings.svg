<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  :root {
    --bg: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --grid: #e0e0dd;
    --s1: #2a78d6; --s2: #008300; --s3: #e87ba4; --s4: #eda100; --s5: #1baf7a;
    --s6: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --ink: #f5f5f2; --muted: #a8a79d; --grid: #33322f;
      --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500; --s5: #199e70;
      --s6: #d95926;
    }
  }
  .surface { fill: var(--bg); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .title { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .panel { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .sub, .tick { fill: var(--muted); }
  .sub { font-size: 11px; }
  .tick { font-size: 10px; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); }
  .s4 { fill: var(--s4); } .s5 { fill: var(--s5); } .s6 { fill: var(--s6); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); }
  .line { fill: none; stroke-width: 2; }
</style>
<rect class="surface" x="0" y="0" width="760" height="260" rx="6"/>
<text class="title" x="52" y="22">Self-assessment by day (1–5)</text>
<text class="sub" x="52" y="38">Averaged across the day's sessions. Judged, not measured — read as direction, not score.</text>
<line class="grid" x1="52" y1="214" x2="744" y2="214"/><text class="tick" x="44" y="218" text-anchor="end">1</text><line class="grid" x1="52" y1="175.5" x2="744" y2="175.5"/><text class="tick" x="44" y="179.5" text-anchor="end">2</text><line class="grid" x1="52" y1="137" x2="744" y2="137"/><text class="tick" x="44" y="141" text-anchor="end">3</text><line class="grid" x1="52" y1="98.5" x2="744" y2="98.5"/><text class="tick" x="44" y="102.5" text-anchor="end">4</text><line class="grid" x1="52" y1="60" x2="744" y2="60"/><text class="tick" x="44" y="64" text-anchor="end">5</text><path class="line l1" d="M398 98.5"/><circle class="s1" cx="398" cy="98.5" r="4"/><path class="line l2" d="M398 60"/><circle class="s2" cx="398" cy="60" r="4"/><path class="line l3" d="M398 98.5"/><circle class="s3" cx="398" cy="98.5" r="4"/><text class="tick" x="398" y="230" text-anchor="middle">08-30</text>
<rect class="s1" x="52" y="240" width="10" height="10" rx="2"/><text class="sub" x="67" y="249">Scoping clarity</text><rect class="s2" x="164" y="240" width="10" height="10" rx="2"/><text class="sub" x="179" y="249">Decision stability</text><rect class="s3" x="276" y="240" width="10" height="10" rx="2"/><text class="sub" x="291" y="249">Tooling leverage</text>
</svg>
