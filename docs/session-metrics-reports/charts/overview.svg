<rect class="s1" x="52" y="250" width="10" height="10" rx="2"/><text class="sub" x="67" y="259">Build</text><rect class="s2" x="160" y="250" width="10" height="10" rx="2"/><text class="sub" x="175" y="259">Setup</text><rect class="s3" x="268" y="250" width="10" height="10" rx="2"/><text class="sub" x="283" y="259">Design</text><rect class="s4" x="376" y="250" width="10" height="10" rx="2"/><text class="sub" x="391" y="259">Docs</text><rect class="s5" x="484" y="250" width="10" height="10" rx="2"/><text class="sub" x="499" y="259">Verify/Ops</text><rect class="s6" x="592" y="250" width="10" height="10" rx="2"/><text class="sub" x="607" y="259">Churn</text>
<text class="panel" x="52" y="278">LLM cost (USD, API-equivalent)</text>
<line class="grid" x1="52" y1="384" x2="744" y2="384"/><text class="tick" x="44" y="388" text-anchor="end">$0</text><line class="grid" x1="52" y1="288" x2="744" y2="288"/><text class="tick" x="44" y="292" text-anchor="end">$40</text><rect class="s1" x="374" y="299.712" width="48" height="84.28799999999998" rx="4"/><text class="tick" x="398" y="294.712" text-anchor="middle">$35</text>
<text class="panel" x="52" y="424">Time (hours)</text>
<line class="grid" x1="52" y1="518" x2="744" y2="518"/><text class="tick" x="44" y="522" text-anchor="end">0h</text><line class="grid" x1="52" y1="434" x2="744" y2="434"/><text class="tick" x="44" y="438" text-anchor="end">5h</text><rect class="s1" x="374" y="506.94" width="23" height="11.059999999999999" rx="3"/><rect class="s2" x="399" y="443.884" width="23" height="74.11599999999999" rx="3"/>
<rect class="s1" x="52" y="544" width="10" height="10" rx="2"/><text class="sub" x="67" y="553">API</text><rect class="s2" x="164" y="544" width="10" height="10" rx="2"/><text class="sub" x="179" y="553">Wall</text>
<text class="tick" x="398" y="533" text-anchor="middle">08-30</text>
</svg>
