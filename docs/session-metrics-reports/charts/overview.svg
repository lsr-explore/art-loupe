<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  :root {
    --bg: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --grid: #e0e0dd;
    --s1: #2a78d6; --s2: #008300; --s3: #e87ba4; --s4: #eda100; --s5: #1baf7a;
    --s6: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --ink: #f5f5f2; --muted: #a8a79d; --grid: #33322f;
      --s1: #3987e5; --s2: #008300; --s3: #d55181; --s4: #c98500; --s5: #199e70;
      --s6: #d95926;
    }
  }
  .surface { fill: var(--bg); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .title { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .panel { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .sub, .tick { fill: var(--muted); }
  .sub { font-size: 11px; }
  .tick { font-size: 10px; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); }
  .s4 { fill: var(--s4); } .s5 { fill: var(--s5); } .s6 { fill: var(--s6); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); } .l3 { stroke: var(--s3); }
  .line { fill: none; stroke-width: 2; }
</style>
<rect class="surface" x="0" y="0" width="760" height="560" rx="6"/>
<text class="title" x="52" y="22">Effort, cost and time by day</text>
<text class="sub" x="52" y="38">Three panels on one shared x-axis — read the cost bar against the effort bar above it.</text>
<text class="panel" x="52" y="64">Effort split (%)</text>
