# Prose linting for this repo's own writing — documentation and source comments.
#
# Styles come from `vale sync`, so `.vale/styles/` holds downloaded third-party content and
# is gitignored on the same reasoning as the agent skills. The curated ArtLoupe vocabulary
# under `config/vocabularies/` IS tracked: it is this project's own word list. A fresh clone
# needs `vale sync` before `pnpm lint:prose` will run.
#
# Run with `pnpm lint:prose`. Not wired into `check:all` — prose findings are advisory, and
# gating every commit on them is a call worth making deliberately.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = ArtLoupe
Packages = Google, Microsoft, write-good, proselint, Readability, Harper, neighbor

# Vale has no inheritance between sections, so the disabled rules below are repeated
# verbatim in each. Keep them in sync.

[*.md]
BasedOnStyles = Vale, Google, Microsoft, write-good, proselint, Readability, Harper, neighbor
# Vocabulary entries drive both Spelling (accept the word) and Terms (enforce one casing of
# it), with no way to have the first without the second. For common nouns like "dev" or
# "worktree" that makes every sentence-initial capital an error, which is noise not signal.
Vale.Terms = NO
Microsoft.Terms = NO
Google.Colons = NO
Google.Spelling = NO
# Spaced em dashes are this repo's house style, used deliberately in every document.
# Google.EmDash and Microsoft.Dashes are the same complaint reported twice, and between them
# were 59% of all findings — so they are off rather than the docs being rewritten.
Microsoft.Dashes = NO
Google.EmDash = NO
# "This is NOT the Next.js you know" is deliberate emphasis, not a missing contraction.
Microsoft.Contractions = NO
# Issue titles follow an `area: lowercase title` convention and are quoted verbatim in
# headings (docs/backlog/README.md). Capitalizing after the colon would stop them matching
# the issue they name, which is the point of quoting them.
Microsoft.HeadingColons = NO

# Source comments. Vale is syntax-aware here: it lints comments and docstrings and leaves
# string literals alone (verified for .ts, .tsx and .py). `.mjs` is deliberately absent —
# vale has no parser mapping for that extension and silently falls back to line-by-line,
# which flags string literals and code tokens as prose. That excludes scripts/reports/*.mjs.
[*.{js,jsx,ts,tsx,py}]
BasedOnStyles = Vale, Google, Microsoft, write-good, proselint, Readability, Harper, neighbor
Vale.Terms = NO
Microsoft.Terms = NO
Google.Colons = NO
Google.Spelling = NO
Microsoft.Dashes = NO
Google.EmDash = NO
Microsoft.Contractions = NO
# Issue titles follow an `area: lowercase title` convention and are quoted verbatim in
# headings (docs/backlog/README.md). Capitalizing after the colon would stop them matching
# the issue they name, which is the point of quoting them.
Microsoft.HeadingColons = NO

# Generated files: rewritten wholesale by their report scripts, so a finding here has nobody
# to fix it and would come straight back on the next regeneration.
[docs/session-metrics-reports/**]
BasedOnStyles =

[docs/test-traceability-reports/**]
BasedOnStyles =

[docs/contrast-report/contrast.md]
BasedOnStyles =
